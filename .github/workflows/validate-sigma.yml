name: Validate Sigma Rules
on:
  push:
    paths: ['rules/**', '.github/workflows/validate-sigma.yml']
  pull_request:
    paths: ['rules/**']

jobs:
  sigma-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sigma-cli
      - name: Validate all Sigma rules parse and pass checks
        run: sigma check rules/
